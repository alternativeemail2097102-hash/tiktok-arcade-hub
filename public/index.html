<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade Hub Broadcast V11</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Draggable.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="theme-obsidian">

    <div class="ticker-wrap"><div class="ticker-track" id="leaderboard-ticker"></div></div>
    <div id="sys-mode-badge" class="status-badge status-demo">🟡 PREVIEW MODE</div>

    <!-- HOST PANEL -->
    <div class="absolute top-14 left-4 z-[100] flex flex-col gap-2">
        <div class="flex gap-2">
            <button id="btn-toggle-host" class="premium-panel text-white text-xs font-black px-3 py-2 uppercase">⚙️ Menu</button>
            <button id="btn-fullscreen" class="premium-panel text-white text-xs font-black px-3 py-2 uppercase">📺 Full</button>
        </div>
        
        <div id="host-menu" class="premium-panel p-4 flex flex-col gap-3 w-[280px] transition-all scale-0 opacity-0 hidden">
            <div class="flex bg-black/40 rounded-lg overflow-hidden">
                <button class="flex-1 py-2 text-xs font-black uppercase text-teal-400 tab-btn" data-target="tab-game">🎮 Game</button>
                <button class="flex-1 py-2 text-xs font-black uppercase text-gray-500 tab-btn" data-target="tab-sys">⚙️ Sys</button>
            </div>

            <div id="tab-game" class="tab-content flex flex-col gap-2">
                <select id="game-selector" class="premium-input text-sm">
                    <option value="word500">🟩 Word500</option>
                    <option value="contexto">🎯 Contexto</option>
                    <option value="wordsearch">🔍 Word Search</option>
                    <option value="memory">🧠 Memory Match</option>
                    <option value="blossom">🌸 Blossom</option>
                </select>
                <select id="diff-selector" class="premium-input text-sm text-yellow-400">
                    <option value="easy">Easy</option>
                    <option value="moderate" selected>Moderate</option>
                    <option value="hard">Hard</option>
                    <option value="extreme">Extreme</option>
                </select>
                <div id="length-wrapper" class="flex flex-col"><input type="range" id="length-slider" min="4" max="12" value="5" class="w-full"></div>
                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-hint" class="premium-btn text-xs bg-yellow-400">💡 Hint</button>
                    <button id="btn-skip" class="premium-btn text-xs bg-gray-600 text-white">⏭️ Skip</button>
                </div>
            </div>

            <div id="tab-sys" class="tab-content hidden flex-col gap-2">
                <input type="text" id="tt-username" placeholder="TikTok Username" class="premium-input text-sm">
                <button id="btn-tt-connect" class="premium-btn bg-teal-500 text-xs">Link TikTok</button>
                <button id="btn-reset-score" class="premium-btn bg-red-900 text-white text-xs">Reset Scores</button>
            </div>
        </div>
    </div>

    <!-- DRAGGABLE RULES -->
    <div id="rules-container" class="absolute bottom-32 left-4 z-[90] w-72 cursor-move">
        <button id="btn-toggle-instructions" class="premium-panel text-white text-xs font-bold px-3 py-1 mb-1 uppercase">ℹ️ Rules (Drag Me)</button>
        <div id="instruction-panel" class="premium-panel p-4 flex flex-col gap-2 transition-all">
            <select id="lang-selector" class="premium-input text-xs bg-black p-1"><option value="en">🇺🇸 English</option><option value="id">🇮🇩 Indonesia</option><option value="ms">🇲🇾 Melayu</option></select>
            <p id="instruction-text" class="text-xs text-white leading-tight"></p>
        </div>
    </div>

    <!-- MAIN GAME STAGE -->
    <div class="fixed inset-0 z-10 flex flex-col items-center justify-center pointer-events-none pt-10">
        <div id="broadcast-stage" class="w-full max-w-4xl flex flex-col items-center pointer-events-auto">
            <h1 class="text-4xl md:text-5xl font-black tracking-tighter accent-text uppercase mb-1 text-center" id="game-title">GAME</h1>
            <p class="text-white text-xs font-bold bg-black/60 px-4 py-1 rounded-full border border-white/10 mb-4" id="game-instructions">Ready...</p>
            
            <div id="game-board" class="w-full premium-panel p-4 flex flex-col gap-2 overflow-y-auto hidden-scrollbar items-center max-h-[60vh]"></div>
            <div id="virtual-keyboard" class="keyboard mt-2" style="display: none;"></div>
        </div>
    </div>

    <!-- HOST INPUT (Bottom) -->
    <div class="fixed bottom-0 left-1/2 -translate-x-1/2 z-[100] flex flex-col items-center w-full px-4 mb-2">
        <div id="host-input-panel" class="premium-panel w-full max-w-md p-3 flex gap-2 items-center">
            <input type="text" id="host-test-input" placeholder="Inject Answer..." class="premium-input flex-1 text-center text-lg uppercase">
            <button id="btn-test-guess" class="premium-btn px-4 py-2">SEND</button>
        </div>
    </div>

    <div id="toast-container" class="fixed top-20 left-1/2 -translate-x-1/2 z-[110] flex flex-col gap-2 w-full max-w-xs"></div>

    <!-- WINNER MODAL -->
    <div id="winner-modal" class="fixed inset-0 z-[120] bg-black/95 backdrop-blur-xl hidden flex-col items-center justify-center opacity-0 px-6 text-center">
        <img id="winner-pic" src="" class="w-32 h-32 rounded-full border-4 border-green-500 mb-4">
        <h2 class="text-2xl font-black text-green-400 uppercase" id="winner-name">USER</h2>
        <h1 class="text-6xl font-black text-white uppercase mt-2" id="winning-word">WORD</h1>
        <p id="word-def" class="text-white text-sm mt-4 italic max-w-md"></p>
    </div>

    <script src="main.js"></script>
</body>
</html>
